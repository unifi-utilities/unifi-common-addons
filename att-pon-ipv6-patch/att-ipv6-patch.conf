# Configuration for AT&T PON Network Link Patch

# The WAN Interface connected to your fiber ONT/Modem (e.g., eth9 for Port 10)
WAN_IFACE="eth9"

# The local IPv4 address used to manage the external ONT/Modem interface
WAN_LOCAL_IP4="192.168.11.2/24"

# The global, routable IPv6 address assigned to your UniFi Console WAN
WAN_GLOBAL_IP6="REDACTED/128"

# Diagnostics targets
IPV4_TEST_TARGET="192.168.11.1"
IPV6_TEST_TARGET="ifconfig.co"
